<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Égalys – Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
 
  <header class=>
    <div class="w">
      <nav aria-label="Navigation principale">
          <a class="brand" href="index.html" aria-label="Égalys, label">
            <img src="logo.svg" alt="Logo Egalys">
            <span aria-hidden="true">ÉGΛLYS</span></a>
          <div class="nl">
            <a href="/">Accueil</a>
            <a href="label.html">Label</a>
            <a href="actualites.html">Actualités</a>
            <a href="aide.html">Aide</a>
            <a href="login.html" aria-current="page" class="on">Connexion</a>
          </div>
        </nav>
    </div>
  </header>
 
  <main class="container login">
 
    <section class="login__form-side">
      <span class="badge">CONNEXION</span>
      <h1 class="login__title">Bon retour <span class="login__title-accent">parmi nous.</span></h1>
      <p class="login__intro">Connectez-vous pour retrouver vos analyses et votre label.</p>
 
      <form class="form" action="/login.html" method="post">
        <div class="field">
          <label for="email" class="field__label">Adresse e-mail</label>
          <input id="email" name="email" type="email" class="field__input" placeholder="prenom.nom@organisation.fr" autocomplete="email" required>
        </div>
 
        <div class="field">
          <div class="field__row">
            <label for="password" class="field__label">Mot de passe</label>
            <a href="/mot-de-passe-oublie" class="link link--small">Mot de passe oublié ?</a>
          </div>
          <input id="password" name="password" type="password" class="field__input" placeholder="Votre mot de passe" autocomplete="current-password" required>
        </div>
 
        <label for="remember" class="checkbox">
          <input id="remember" name="remember" type="checkbox" class="checkbox__input">
          Rester connecté sur cet appareil
        </label>
 
        <button type="submit" class="button">Se connecter</button>
      </form>
 
      <p class="login__switch">Pas encore de compte ? <a href="/register.html" class="link link--strong">Créer un compte</a></p>
    </section>
 
    <aside class="login__visual">
      <div class="visual-card">
        <svg class="visual-card__logo" width="220" height="240" viewBox="0 0 40 44" aria-hidden="true">
          <circle cx="12" cy="5" r="3" fill="#114E48"/>
          <circle cx="28" cy="5" r="3" fill="#C4B29C"/>
          <path d="M18 16 A11 11 0 0 0 18 38" fill="none" stroke="#114E48" stroke-width="5"/>
          <path d="M22 16 A11 11 0 0 1 22 38" fill="none" stroke="#C4B29C" stroke-width="5"/>
          <rect x="14" y="23" width="12" height="2.2" fill="#C4B29C"/>
          <rect x="14" y="28" width="12" height="2.2" fill="#9BAA97"/>
        </svg>
        <p class="visual-card__tagline">L'égalité reconnue, les progrès démontrés.</p>
      </div>
    </aside>
 
  </main>
 
  <footer>
      <div class="w">
        <span class="brand"
          >
        <img src="logo.svg">
        <span aria-hidden="true">ÉGΛLYS</span></span
        ><span>L'égalité reconnue, les progrès démontrés.</span>
      </div>
    </footer>
 
</body>
</html>
